# Nginx site config for tarajuvva.com (Lightsail / Ubuntu)
# Install: sudo cp deploy/nginx/tarajuvva.conf /etc/nginx/sites-available/default
#          sudo nginx -t && sudo systemctl reload nginx
# SSL:     sudo certbot --nginx -d tarajuvva.com -d www.tarajuvva.com

server {
    listen 443 ssl http2;
    server_name tarajuvva.com www.tarajuvva.com;

    # Canonical host: always use apex domain
    if ($host = www.tarajuvva.com) {
        return 301 https://tarajuvva.com$request_uri;
    }

    # Match Express JSON limit; product saves use multipart (up to 12 × 6MB images).
    client_max_body_size 80M;

    root /var/www/html;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/tarajuvva.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tarajuvva.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # HSTS for tarajuvva.com and www (SEO audit notice). No includeSubDomains/preload on purpose:
    # other subdomains may still be served over plain HTTP.
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Compress text responses, including ones proxied from the backend (SEO audit: 56 uncompressed JS/CSS).
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json
               application/xml application/rss+xml application/manifest+json image/svg+xml font/ttf font/otf;

    # Generated from the product catalog. Must win over the SPA fallback.
    location = /sitemap.xml {
        proxy_pass http://localhost:4000/sitemap.xml;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /uploads/ {
        proxy_pass http://localhost:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /api/ {
        client_max_body_size 80M;
        proxy_pass http://localhost:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Public pages get server-rendered SEO HTML from the backend (backend/src/routes/seoPages.js):
    # unique title/meta/canonical, H1 and page copy, and 301s from old product links to /shop/<type>/<slug>.
    # If the backend is down or errors, fall back to the static SPA shell.
    location = / {
        include /etc/nginx/snippets/tarajuvva-seo-proxy.conf;
    }
    location = /sitemap.html {
        include /etc/nginx/snippets/tarajuvva-seo-proxy.conf;
    }
    location ~ ^/(shop|reimagine|repair|donate|about|help)/?$ {
        include /etc/nginx/snippets/tarajuvva-seo-proxy.conf;
    }
    location ~ ^/shop/[^/]+(/[^/]+)?/?$ {
        include /etc/nginx/snippets/tarajuvva-seo-proxy.conf;
    }
    location @spa_shell {
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Cache-Control "no-cache";
        rewrite ^ /index.html break;
    }

    # Vite's hashed bundles never change in place: cache for a year.
    location /assets/ {
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }
}

server {
    listen 80;
    server_name tarajuvva.com www.tarajuvva.com;
    return 301 https://tarajuvva.com$request_uri;
}
