# Included by tarajuvva.conf for public pages rendered by the backend (SEO HTML).
# Install: sudo cp deploy/nginx/tarajuvva-seo-proxy.conf /etc/nginx/snippets/   (deploy.sh does this)
proxy_pass http://localhost:4000;
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_connect_timeout 5s;
proxy_read_timeout 15s;
# Backend errors / downtime: serve the plain SPA shell instead of an error page.
proxy_intercept_errors on;
error_page 500 502 503 504 = @spa_shell;
